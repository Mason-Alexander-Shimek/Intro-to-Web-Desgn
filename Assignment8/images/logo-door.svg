<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Within Reach">
  <!-- doorway -->
  <path d="M5 29 V6 a1 1 0 0 1 1-1 h20 a1 1 0 0 1 1 1 v23"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the door, standing open -->
  <path d="M19.5 29 V9.4 L10.5 7 v22"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- handle -->
  <circle cx="17" cy="19" r="1.3" fill="currentColor"/>
  <!-- threshold -->
  <path d="M3 29 h26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg>
