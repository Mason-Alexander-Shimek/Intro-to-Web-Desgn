  <path fill="#93A8B5" d="M0 268 C 180 252, 330 282, 520 266 C 700 251, 860 280, 1040 264 C 1110 258, 1160 262, 1200 258 L1200 300 L0 300 Z"/>
  <path fill="#A8BAC4" opacity=".55" d="M0 276 C 190 262, 340 288, 530 274 C 710 260, 870 286, 1050 272 C 1115 267, 1162 270, 1200 267 L1200 300 L0 300 Z"/>

